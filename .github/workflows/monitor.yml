name: VPN Keys Monitor

on:
  schedule:
    - cron: '*/15 * * * *'      # Каждые 15 минут
  workflow_dispatch:            # Ручной запуск

jobs:
  check-keys:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # Для обновления status.json и docs
      pages: write             # Для GitHub Pages
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r bot/requirements.txt
      
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot/main.py
      
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status.json docs/index.html
          git diff --staged --quiet || git commit -m "Update status $(date +'%Y-%m-%d %H:%M:%S')"
          git push
