name: 🚀 VLESS VPN Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Каждые 6 часов

jobs:
  vless:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 часов
    
    steps:
      # ============================================
      # 1. КЛОНИРУЕМ РЕПОЗИТОРИЙ
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # ============================================
      # 2. УСТАНАВЛИВАЕМ ЗАВИСИМОСТИ
      # ============================================
      - name: Устанавливаем зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip curl wget jq
          sudo pip3 install requests
      
      # ============================================
      # 3. ЗАПУСКАЕМ ГЕНЕРАТОР VLESS
      # ============================================
      - name: Генерируем VLESS ключ
        run: |
          python3 vless_generator.py
      
      # ============================================
      # 4. ПОКАЗЫВАЕМ РЕЗУЛЬТАТ
      # ============================================
      - name: Выводим информацию
        run: |
          echo "=================================================="
          echo "         ✅ VLESS VPN ГОТОВ ✅"
          echo "=================================================="
          echo ""
          cat vless_result.txt
          echo ""
          echo "=================================================="
          echo "  📌 СКОПИРУЙТЕ VLESS ССЫЛКУ ВЫШЕ"
          echo "  📱 ВСТАВЬТЕ В V2RayNG / Shadowrocket / HAPP"
          echo "=================================================="
      
      # ============================================
      # 5. СОХРАНЯЕМ РЕЗУЛЬТАТ
      # ============================================
      - name: Сохраняем результат в файл
        uses: actions/upload-artifact@v4
        with:
          name: vless-config
          path: |
            vless_result.txt
            vless_config.json
      
      # ============================================
      # 6. ДЕРЖИМ СЕРВЕР
      # ============================================
      - name: Keep alive
        run: sleep 21000
