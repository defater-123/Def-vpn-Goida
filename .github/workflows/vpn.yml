name: Xray VPN (РФ‑ready + логи)

on:
  workflow_dispatch:

jobs:
  vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Установка Xray
        run: |
          wget -qO xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -qo xray.zip
          chmod +x xray
          mkdir -p logs

      - name: Генерация ключей Reality
        id: keys
        run: |
          KEYS=$(./xray x25519)
          PRIVATE_KEY=$(echo "$KEYS" | grep "Private key" | awk '{print $3}')
          PUBLIC_KEY=$(echo "$KEYS" | grep "Public key" | awk '{print $3}')
          UUID=$(uuidgen)
          SHORT_ID=$(openssl rand -hex 8)
          echo "PRIVATE_KEY=$PRIVATE_KEY" >> $GITHUB_ENV
          echo "PUBLIC_KEY=$PUBLIC_KEY" >> $GITHUB_ENV
          echo "UUID=$UUID" >> $GITHUB_ENV
          echo "SHORT_ID=$SHORT_ID" >> $GITHUB_ENV

      - name: Выбор тоннеля (ngrok, bore или serveo)
        run: |
          if [ -n "${{ secrets.NGROK_AUTH_TOKEN }}" ]; then
            echo "TUNNEL=ngrok" >> $GITHUB_ENV
          else
            echo "TUNNEL=bore" >> $GITHUB_ENV
          fi

      - name: Запуск ngrok (если добавлен секрет)
        if: env.TUNNEL == 'ngrok'
        run: |
          wget -qO ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-linux-amd64.zip
          unzip -qo ngrok.zip
          ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          ./ngrok tcp 8443 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 3
          for i in {1..20}; do
            TUNNEL_URL=$(curl -s localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url' 2>/dev/null)
            if [ -n "$TUNNEL_URL" ]; then break; fi
            sleep 1
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Не удалось получить адрес ngrok"
            exit 1
          fi
          REMOTE_HOST=$(echo "$TUNNEL_URL" | sed -E 's|tcp://([^:]+):([0-9]+)|\1|')
          REMOTE_PORT=$(echo "$TUNNEL_URL" | sed -E 's|tcp://([^:]+):([0-9]+)|\2|')
          echo "REMOTE_HOST=$REMOTE_HOST" >> $GITHUB_ENV
          echo "REMOTE_PORT=$REMOTE_PORT" >> $GITHUB_ENV
          echo "✅ ngrok: $REMOTE_HOST:$REMOTE_PORT"

      - name: Запуск bore (публичный, РФ‑дружелюбный)
        if: env.TUNNEL == 'bore'
        run: |
          wget -qO bore.tar.gz https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz
          tar xzf bore.tar.gz
          chmod +x bore
          nohup ./bore local 8443 --to bore.pub > /tmp/bore.log 2>&1 &
          sleep 4
          BORE_OUTPUT=$(cat /tmp/bore.log)
          REMOTE_PORT=$(echo "$BORE_OUTPUT" | grep -oP 'listening at bore.pub:\K[0-9]+')
          if [ -z "$REMOTE_PORT" ]; then
            sleep 5
            BORE_OUTPUT=$(cat /tmp/bore.log)
            REMOTE_PORT=$(echo "$BORE_OUTPUT" | grep -oP 'listening at bore.pub:\K[0-9]+')
          fi
          if [ -z "$REMOTE_PORT" ]; then
            echo "❌ bore не выдал порт. Лог:"
            cat /tmp/bore.log
            exit 1
          fi
          echo "REMOTE_HOST=bore.pub" >> $GITHUB_ENV
          echo "REMOTE_PORT=$REMOTE_PORT" >> $GITHUB_ENV
          echo "✅ bore.pub туннель: bore.pub:$REMOTE_PORT"

      - name: Запасной serveo (если bore не взлетел, но ты поменял TUNNEL)
        if: env.TUNNEL == 'serveo'
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:8443 serveo.net > /tmp/serveo.log 2>&1 &
          sleep 5
          TUNNEL_LINE=$(grep -oP 'serveo\.net:\d+' /tmp/serveo.log | head -1)
          if [ -z "$TUNNEL_LINE" ]; then sleep 5; TUNNEL_LINE=$(grep -oP 'serveo\.net:\d+' /tmp/serveo.log | head -1); fi
          if [ -z "$TUNNEL_LINE" ]; then
            echo "❌ serveo недоступен"
            exit 1
          fi
          REMOTE_HOST="serveo.net"
          REMOTE_PORT=$(echo "$TUNNEL_LINE" | cut -d: -f2)
          echo "REMOTE_HOST=$REMOTE_HOST" >> $GITHUB_ENV
          echo "REMOTE_PORT=$REMOTE_PORT" >> $GITHUB_ENV
          echo "✅ serveo: $REMOTE_HOST:$REMOTE_PORT"

      - name: Конфигурация и запуск Xray
        run: |
          cat > server.json << EOF
          {
            "log": {
              "access": "/tmp/access.log",
              "error": "/tmp/error.log",
              "loglevel": "info"
            },
            "inbounds": [{
              "port": 8443,
              "protocol": "vless",
              "settings": {
                "clients": [{"id": "$UUID", "flow": "xtls-rprx-vision"}],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "tcp",
                "security": "reality",
                "realitySettings": {
                  "show": false,
                  "dest": "www.microsoft.com:443",
                  "xver": 0,
                  "serverNames": ["www.microsoft.com"],
                  "privateKey": "$PRIVATE_KEY",
                  "shortIds": ["$SHORT_ID"]
                }
              }
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          EOF
          sudo ./xray run -config server.json &
          sleep 2
          echo "✅ Xray запущен"

      - name: Клиентский ключ и артефакт
        run: |
          CLIENT_LINK="vless://$UUID@$REMOTE_HOST:$REMOTE_PORT?encryption=none&security=reality&sni=www.microsoft.com&fp=chrome&type=tcp&flow=xtls-rprx-vision&pbk=$PUBLIC_KEY&sid=$SHORT_ID#GitHubVPN"
          echo "$CLIENT_LINK" > key.txt
          echo "🔑 Готовый ключ:"
          cat key.txt
        env:
          REMOTE_HOST: ${{ env.REMOTE_HOST }}
          REMOTE_PORT: ${{ env.REMOTE_PORT }}

      - name: Сохранить ключ и логи
        uses: actions/upload-artifact@v4
        with:
          name: vpn-data
          path: |
            key.txt
            /tmp/access.log
            /tmp/error.log

      - name: Ждём и показываем логи запросов
        run: |
          echo "🎯 VPN активен. Каждые 30 секунд — свежие записи из access.log."
          while true; do
            if [ -f /tmp/access.log ]; then
              echo "--- Последние обращения (сайты) ---"
              tail -n 10 /tmp/access.log 2>/dev/null || echo "(журнал пока пуст)"
            fi
            sleep 30
          done
        timeout-minutes: 350
